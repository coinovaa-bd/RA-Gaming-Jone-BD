name: Build 3D APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip App
        run: |
          unzip -o RA-Gaming-Jone-SMALL.zip -d app_src
          ls -R app_src | head -n 100
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          APP_DIR=$(find app_src -name "gradlew" -exec dirname {} \; | head -n 1)
          echo "Found at $APP_DIR"
          cd "$APP_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          find . -name "*.apk" -type f
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RA-Gaming-Jone-BD-APK
          path: "**/app-debug.apk"
          if-no-files-found: error
