name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip project
        run: |
          unzip -o RA-Gaming-Jone-SMALL.zip -d app-src
          ls app-src
      - name: Build with Capacitor
        run: |
          cd app-src
          npm uninstall @capacitor-community/admob || true
          rm -f configure-android.mjs
          rm -rf android dist
          npm install
          mkdir -p dist
          cp index.html main.js style.css ra-gaming-jone-golden-logo.png dist/ || true
          cp *.html *.js *.css *.png dist/ || true
          rm -f dist/ads.js dist/admob-config.js
          sed -i '/admob/d; /ads\.js/d; /AdMob/d' dist/index.html || true
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-src/android/app/build/outputs/apk/debug/app-debug.apk
